name: API reference

# Publishes the API reference to GitHub Pages: the OpenAPI description is
# generated from the code (npm run openapi) and shown with Scalar. Needs
# Settings → Pages → Source: GitHub Actions.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v5
              with:
                  node-version: 26
                  cache: npm
            - run: npm ci
              env:
                  DISABLE_ERD: 'true'
                  PUPPETEER_SKIP_DOWNLOAD: 'true'
            # The app is only assembled, never started: the database URL just
            # has to be well-formed. PUBLIC_URL is where "Try it" sends requests.
            - run: |
                  mkdir -p site
                  cp docs/api/index.html site/
                  npm run openapi -- site/openapi.json
              env:
                  DATABASE_URL: mysql://docs:docs@localhost:3306/docs
                  PUBLIC_URL: https://api.wireterm.wirecore.net
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
