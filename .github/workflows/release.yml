name: Release

# A tag X.Y.Z (a plain version, no "v") publishes the server image to Docker Hub and GitHub Container
# Registry as X.Y.Z, X.Y, X and latest, for amd64 and arm64.
on:
    push:
        tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
    contents: read
    packages: write

jobs:
    image:
        runs-on: ubuntu-latest
        # Holds DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token limited to
        # this repository, not a password). Protect it so only tags from this
        # repository can use it.
        environment: release
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-qemu-action@v4
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: |
                      wirecore/wireterm-server
                      ghcr.io/${{ github.repository_owner }}/wireterm-server
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: .docker/prod/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
