# Example for running the WireTerm server yourself: MariaDB and the server,
# migrations on every start. Put a reverse proxy with TLS in front (and set
# TRUST_PROXY=1 then); the server itself speaks plain HTTP on port 80.
#
#   cp .env.example .env
#   # .env.example is set up for development. Change at least: PUBLIC_URL,
#   # BETTER_AUTH_SECRET, COOKIE_SECRET, CORS_ORIGIN and
#   # BETTER_AUTH_TRUSTED_ORIGINS (empty for the desktop client only),
#   # BETTER_AUTH_COOKIE_DOMAIN (empty), BETTER_AUTH_DISABLE_ORIGIN_CHECK=0,
#   # SMTP_* and SMTP_FROM.
#   echo "DB_PASSWORD=$(openssl rand -hex 24)" >> .env
#   echo "DB_ROOT_PASSWORD=$(openssl rand -hex 24)" >> .env
#   docker compose -f docker-compose.prod.yml up -d
#
# DB_PASSWORD and DB_ROOT_PASSWORD only set up the database container; the
# server gets its connection as DATABASE_URL, built from them below.
services:
    db:
        image: mariadb:11.4
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
            MARIADB_DATABASE: wireterm
            MARIADB_USER: wireterm
            MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 10s
            retries: 10

    server:
        image: wirecore/wireterm-server:1
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        env_file: .env
        environment:
            # Hex passwords need no percent-encoding.
            DATABASE_URL: mysql://wireterm:${DB_PASSWORD}@db:3306/wireterm
            # The container's own defaults, in case .env came from development.
            SERVER_PORT: '80'
            API_DOCS: 'false'
        command:
            ['sh', '-c', 'npx prisma migrate deploy && node dist/server.js']
        ports:
            # Only for the reverse proxy on this host.
            - '127.0.0.1:8080:80'

volumes:
    db-data:
